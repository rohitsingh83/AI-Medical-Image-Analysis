<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Browser frame -->
  <rect x="10" y="10" width="860" height="540" rx="10" fill="#ffffff" stroke="#c9d6e2"/>
  <rect x="10" y="10" width="860" height="44" rx="10" fill="#12263a"/>
  <circle cx="36" cy="32" r="6" fill="#e74c3c"/>
  <circle cx="56" cy="32" r="6" fill="#f1c40f"/>
  <circle cx="76" cy="32" r="6" fill="#2ecc71"/>
  <rect x="110" y="20" width="420" height="24" rx="12" fill="#1c3550"/>
  <text x="130" y="37" font-size="12" fill="#9fb3c8">http://127.0.0.1:5000  ·  AI Medical Image Analysis</text>

  <!-- Header -->
  <rect x="10" y="54" width="860" height="64" fill="#12263a"/>
  <rect x="34" y="70" width="36" height="36" rx="8" fill="#1a6fb5"/>
  <text x="44" y="95" font-size="20" fill="#ffffff">+</text>
  <text x="84" y="86" font-size="17" font-weight="600" fill="#ffffff">AI-Powered Medical Image Analysis</text>
  <text x="84" y="105" font-size="11" fill="#9fb3c8">Deep-learning pneumonia detection from chest X-rays · Student demo system</text>

  <!-- Upload card -->
  <rect x="60" y="145" width="760" height="210" rx="12" fill="#ffffff" stroke="#e1e8ef"/>
  <text x="88" y="180" font-size="15" font-weight="600" fill="#1a6fb5">Upload a Chest X-Ray</text>
  <text x="88" y="203" font-size="11" fill="#3c4c5e">Select a chest X-ray image (PNG / JPG). The CNN model will classify it as</text>
  <text x="88" y="220" font-size="11" fill="#3c4c5e">NORMAL or PNEUMONIA and highlight decision regions with a Grad-CAM heatmap.</text>
  <rect x="120" y="238" width="640" height="92" rx="10" fill="#f4f8fb" stroke="#1a6fb5" stroke-dasharray="6 4"/>
  <text x="420" y="272" font-size="22" text-anchor="middle" fill="#526272">&#128444;</text>
  <text x="420" y="292" font-size="11" text-anchor="middle" fill="#526272">choose file: pneumonia_case_01.jpeg</text>
  <rect x="378" y="336" width="124" height="0" fill="none"/>
  <rect x="370" y="300" width="140" height="26" rx="6" fill="#1a6fb5"/>
  <text x="440" y="317" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">Analyze X-Ray</text>

  <!-- How it works -->
  <rect x="60" y="372" width="760" height="96" rx="12" fill="#ffffff" stroke="#e1e8ef"/>
  <text x="88" y="400" font-size="13" font-weight="600" fill="#1a6fb5">How It Works</text>
  <rect x="88" y="414" width="220" height="40" rx="8" fill="#f4f8fb" stroke="#16a085"/>
  <text x="100" y="431" font-size="10" font-weight="600" fill="#12263a">1. Preprocess</text>
  <text x="100" y="445" font-size="8.5" fill="#526272">resize · grayscale · normalize</text>
  <rect x="328" y="414" width="220" height="40" rx="8" fill="#f4f8fb" stroke="#16a085"/>
  <text x="340" y="431" font-size="10" font-weight="600" fill="#12263a">2. CNN Inference</text>
  <text x="340" y="445" font-size="8.5" fill="#526272">conv features → probability</text>
  <rect x="568" y="414" width="220" height="40" rx="8" fill="#f4f8fb" stroke="#16a085"/>
  <text x="580" y="431" font-size="10" font-weight="600" fill="#12263a">3. Explain</text>
  <text x="580" y="445" font-size="8.5" fill="#526272">Grad-CAM lung heatmap</text>

  <!-- Footer -->
  <text x="440" y="505" font-size="10" text-anchor="middle" fill="#6b7c8d">AI-Medical-Image-Analysis · Flask + TensorFlow demo · Built for learning and portfolio proof</text>
  <text x="440" y="530" font-size="9" text-anchor="middle" fill="#b07d17">Academic demo — not a certified medical device</text>
</svg>
